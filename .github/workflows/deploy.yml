# Workflow for building, testing, and deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

# To avoid installing Git Hooks on CI servers or in Docker, use HUSKY=0
env:
  HUSKY: 0

jobs:
  deploy:
    # Manual runs can start from any branch, but the github-pages environment
    # only accepts deployments from main.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Playwright's own image already ships the browsers and their system
    # libraries, so CI runs the same Chromium as a local `npm run test:install`
    # without installing anything. The tag has to match the `playwright`
    # version in package.json, or the browser Vitest and Lighthouse ask for
    # won't be in the image.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0
      # Docker caps /dev/shm at 64MB, which is not enough for Chromium.
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload lighthouseci-reports artifact
        # Also upload when tests fail, since that is when the reports matter.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouseci-reports
          path: './.lighthouseci-reports'
          retention-days: 7
          include-hidden-files: true

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload dist folder
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
