# Adapted from Vitest's "The Update Workflow":
# https://vitest.dev/guide/browser/visual-regression-testing
# References are only valid from the environment that checks them, so this runs
# in the same Playwright image as deploy.yml rather than on a developer machine.
name: Update visual regression screenshots

on:
  # Manual trigger only. Pick the feature branch to update in the Actions tab.
  workflow_dispatch:

# To avoid installing Git Hooks on CI servers or in Docker, use HUSKY=0
env:
  HUSKY: 0
  AUTHOR_NAME: 'github-actions[bot]'
  AUTHOR_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
  COMMIT_MESSAGE: |
    test: update visual regression screenshots

    Co-authored-by: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>

jobs:
  update-screenshots:
    # Never on main: references change through a reviewed branch.
    if: github.ref_name != github.event.repository.default_branch

    # One at a time per branch
    concurrency:
      group: visual-regression-screenshots@${{ github.ref_name }}
      cancel-in-progress: true

    permissions:
      contents: write # pushes the updated references

    runs-on: ubuntu-latest
    # Keep in lockstep with deploy.yml, which checks these references. Its
    # comments explain the tag and --ipc=host.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Configure Git
        run: |
          git config --global user.name "$AUTHOR_NAME"
          git config --global user.email "$AUTHOR_EMAIL"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `--` matters: `npm run test:visual --update` would hand the flag to npm,
      # not Vitest. `--update` writes new and changed references alike.
      - name: Update screenshots
        run: npm run test:visual -- --update

      - name: Commit and push changed screenshots
        id: commit
        run: |
          # Stage references only, so nothing else the run touched gets committed
          git add -A -- ':(glob)src/**/__screenshots__/**'
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo 'files<<EOF'
              git diff --cached --name-only
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            git commit -m "$COMMIT_MESSAGE"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Summary
        env:
          CHANGED: ${{ steps.commit.outputs.changed }}
          FILES: ${{ steps.commit.outputs.files }}
        run: |
          if [ "$CHANGED" = true ]; then
            {
              echo "### Visual regression screenshots updated on \`$GITHUB_REF_NAME\`"
              echo
              echo '```'
              echo "$FILES"
              echo '```'
              echo
              echo 'Pushed with GITHUB_TOKEN, which starts no new workflow runs.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No screenshot changes on \`$GITHUB_REF_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          fi
